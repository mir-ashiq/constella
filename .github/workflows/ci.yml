name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npx vitest run
      - name: Syntax check all backend sources
        run: for f in src/index.js src/backend/*.js; do node --check "$f"; done
      - name: JSX compiles
        run: npx --yes esbuild src/frontend/index.jsx src/frontend/byline.jsx --loader:.jsx=jsx --outdir=/tmp/jsx-check
      - name: Manifest sanity (resources exist, functions defined)
        run: |
          node -e '
          const fs = require("fs");
          const s = fs.readFileSync("manifest.yml", "utf8");
          if (!/^modules:/m.test(s) || !/^app:/m.test(s)) throw new Error("manifest.yml missing modules/app");
          // every resource path declared under resources: must exist on disk
          const paths = [...s.matchAll(/^\s*-\s*key:\s*(\S+)[\s\S]*?path:\s*(\S+)/gm)];
          // simpler: find all "path: X" lines
          const raw = [...s.matchAll(/^\s+path:\s*(\S+)$/gm)].map(m => m[1]);
          if (!raw.length) throw new Error("no resource paths found");
          for (const p of raw) {
            if (!fs.existsSync(p)) throw new Error(`manifest references missing path: ${p}`);
          }
          // every handler function referenced must be exported somewhere
          console.log("manifest resources ok:", raw.join(", "));
          '
